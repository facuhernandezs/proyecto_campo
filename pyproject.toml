[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maize-forecasting"
version = "0.1.0"
description = "Forecasting de rendimiento de maiz en Argentina"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
